# Pubblica il sito su GitHub Pages a ogni push su main.
#
# Il sito sta in una sottocartella del dominio (andreagalanti91.github.io/nerbona),
# quindi serve BASE_PATH; SITE_URL decide cosa si dichiara ai motori di ricerca.
# NOINDEX=true finché è un'anteprima: quando il sito passa su nerbona.com va
# tolto, insieme a BASE_PATH.
#
# Prima volta: Settings → Pages → Source: "GitHub Actions".
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Compila il sito
        run: npm run build:static
        env:
          SITE_ID: nerbona
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NOINDEX: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/nerbona

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
